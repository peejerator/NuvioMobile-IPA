name: Update Nuvio SideStore Source

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream Nuvio tag. Leave blank for latest release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nuvio-sidestore-source
  cancel-in-progress: false

jobs:
  update-source:
    name: Update SideStore source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Determine upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_TAG:-}" ]; then
            RELEASE_JSON="$(
              gh api \
                "repos/NuvioMedia/NuvioMobile/releases/tags/$MANUAL_TAG"
            )"
          else
            RELEASE_JSON="$(
              gh api \
                repos/NuvioMedia/NuvioMobile/releases/latest
            )"
          fi

          TAG="$(
            echo "$RELEASE_JSON" |
              jq -r '.tag_name'
          )"

          RELEASE_URL="$(
            echo "$RELEASE_JSON" |
              jq -r '.html_url'
          )"

          PUBLISHED_AT="$(
            echo "$RELEASE_JSON" |
              jq -r '.published_at'
          )"

          CHANGELOG="$(
            echo "$RELEASE_JSON" |
              jq -r '.body // ""'
          )"

          IPA_NAME="$(
            echo "$RELEASE_JSON" |
              jq -r '
                [
                  .assets[]
                  | select(
                      (.name | ascii_downcase | endswith(".ipa"))
                      and
                      (.name | test("full"; "i"))
                    )
                ]
                | .[0].name
              '
          )"

          IPA_URL="$(
            echo "$RELEASE_JSON" |
              jq -r '
                [
                  .assets[]
                  | select(
                      (.name | ascii_downcase | endswith(".ipa"))
                      and
                      (.name | test("full"; "i"))
                    )
                ]
                | .[0].browser_download_url
              '
          )"

          IPA_SIZE="$(
            echo "$RELEASE_JSON" |
              jq -r '
                [
                  .assets[]
                  | select(
                      (.name | ascii_downcase | endswith(".ipa"))
                      and
                      (.name | test("full"; "i"))
                    )
                ]
                | .[0].size
              '
          )"

          if [ -z "$IPA_NAME" ] ||
             [ "$IPA_NAME" = "null" ] ||
             [ -z "$IPA_URL" ] ||
             [ "$IPA_URL" = "null" ]; then

            echo "::error::No official Full iOS IPA found for $TAG"
            exit 1
          fi

          echo "Release: $TAG"
          echo "IPA: $IPA_NAME"
          echo "IPA URL: $IPA_URL"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_url=$IPA_URL" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$IPA_SIZE" >> "$GITHUB_OUTPUT"

          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Download official IPA
        env:
          IPA_URL: ${{ steps.release.outputs.ipa_url }}
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            "$IPA_URL" \
            --output official.ipa

          echo "Downloaded official IPA:"
          ls -lh official.ipa

      - name: Extract IPA metadata
        id: metadata
        run: |
          set -euo pipefail

          python3 <<'PY'
          import hashlib
          import os
          import plistlib
          import zipfile

          ipa = "official.ipa"

          with zipfile.ZipFile(ipa, "r") as archive:
              plists = [
                  name
                  for name in archive.namelist()
                  if
                  name.startswith("Payload/")
                  and
                  name.count("/") == 2
                  and
                  name.endswith(".app/Info.plist")
              ]

              if not plists:
                  raise RuntimeError(
                      "App Info.plist not found."
                  )

              info = plistlib.loads(
                  archive.read(plists[0])
              )

          with open(ipa, "rb") as handle:
              sha256 = hashlib.sha256(
                  handle.read()
              ).hexdigest()

          values = {
              "bundle_id":
                  info["CFBundleIdentifier"],

              "version":
                  info["CFBundleShortVersionString"],

              "build":
                  info["CFBundleVersion"],

              "min_os":
                  info.get(
                      "MinimumOSVersion",
                      "16.1"
                  ),

              "sha256":
                  sha256,
          }

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as output:

              for key, value in values.items():
                  output.write(
                      f"{key}={value}\n"
                  )

          for key, value in values.items():
              print(f"{key}: {value}")
          PY

      - name: Update source.json
        env:
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_URL: ${{ steps.release.outputs.release_url }}
          PUBLISHED_AT: ${{ steps.release.outputs.published_at }}
          CHANGELOG: ${{ steps.release.outputs.changelog }}
          IPA_URL: ${{ steps.release.outputs.ipa_url }}
          IPA_SIZE: ${{ steps.release.outputs.ipa_size }}

          BUNDLE_ID: ${{ steps.metadata.outputs.bundle_id }}
          APP_VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_VERSION: ${{ steps.metadata.outputs.build }}
          MIN_OS: ${{ steps.metadata.outputs.min_os }}
          SHA256: ${{ steps.metadata.outputs.sha256 }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("source.json")

          icon_url = (
              "https://raw.githubusercontent.com/"
              f"NuvioMedia/NuvioMobile/{os.environ['TAG']}/"
              "iosApp/iosApp/Assets.xcassets/"
              "AppIcon.appiconset/"
              "app-icon-1024.png"
          )

          new_version = {
              "version":
                  os.environ["APP_VERSION"],

              "buildVersion":
                  os.environ["BUILD_VERSION"],

              "date":
                  os.environ["PUBLISHED_AT"],

              "localizedDescription":
                  os.environ["CHANGELOG"]
                  or
                  f"Nuvio {os.environ['APP_VERSION']}",

              "downloadURL":
                  os.environ["IPA_URL"],

              "size":
                  int(
                      os.environ["IPA_SIZE"]
                  ),

              "sha256":
                  os.environ["SHA256"],

              "minOSVersion":
                  os.environ["MIN_OS"],
          }

          if path.exists():
              source = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )
          else:
              source = {
                  "name":
                      "Nuvio Full iOS",

                  "subtitle":
                      "Official Nuvio Full iOS releases",

                  "description":
                      "SideStore source for official "
                      "Nuvio Full iOS builds.",

                  "website":
                      "https://github.com/NuvioMedia/NuvioMobile",

                  "iconURL":
                      icon_url,

                  "tintColor":
                      "7B2FF7",

                  "news":
                      [],

                  "apps": [
                      {
                          "name":
                              "Nuvio",

                          "bundleIdentifier":
                              os.environ["BUNDLE_ID"],

                          "developerName":
                              "Nuvio",

                          "subtitle":
                              "Official Full iOS build",

                          "localizedDescription":
                              "Official Nuvio Full iOS "
                              "release builds.",

                          "iconURL":
                              icon_url,

                          "tintColor":
                              "7B2FF7",

                          "category":
                              "entertainment",

                          "versions":
                              [],
                      }
                  ],
              }

          source["website"] = \
              "https://github.com/NuvioMedia/NuvioMobile"

          source["iconURL"] = \
              icon_url

          app = source["apps"][0]

          app["bundleIdentifier"] = \
              os.environ["BUNDLE_ID"]

          app["iconURL"] = \
              icon_url

          versions = app.setdefault(
              "versions",
              []
          )

          version = \
              os.environ["APP_VERSION"]

          build = \
              os.environ["BUILD_VERSION"]

          versions = [
              item
              for item in versions
              if not (
                  item.get("version")
                  == version
                  and
                  str(
                      item.get(
                          "buildVersion"
                      )
                  )
                  == str(build)
              )
          ]

          versions.insert(
              0,
              new_version
          )

          app["versions"] = versions

          path.write_text(
              json.dumps(
                  source,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Validate source.json
        run: |
          set -euo pipefail

          python3 \
            -m json.tool \
            source.json \
            >/dev/null

          echo
          echo "Current versions:"

          jq -r \
            '.apps[0].versions[] |
            "\(.version) (\(.buildVersion)) -> \(.downloadURL)"' \
            source.json

      - name: Commit source.json
        run: |
          set -euo pipefail

          if git diff \
                --quiet \
                -- source.json &&
             git ls-files \
                --error-unmatch \
                source.json \
                >/dev/null 2>&1
          then
            echo "source.json is already current."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            source.json

          git commit \
            -m \
            "Update SideStore source for Nuvio ${{ steps.release.outputs.tag }}"

          git push \
            origin \
            main