name: Build Nuvio iOS IPA

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream Nuvio tag. Leave blank for latest stable release."
        required: false
        type: string

      force_rebuild:
        description: "Rebuild even if this version already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nuvio-ios-builder
  cancel-in-progress: false

jobs:
  check-release:
    name: Check upstream release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_build: ${{ steps.release.outputs.should_build }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      upstream_url: ${{ steps.release.outputs.upstream_url }}

    steps:
      - name: Determine Nuvio version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_TAG:-}" ]; then
            TAG="$MANUAL_TAG"

            RELEASE_JSON="$(
              gh api \
                "repos/NuvioMedia/NuvioMobile/releases/tags/$TAG"
            )"
          else
            RELEASE_JSON="$(
              gh api \
                repos/NuvioMedia/NuvioMobile/releases/latest
            )"

            TAG="$(
              echo "$RELEASE_JSON" |
                jq -r '.tag_name'
            )"
          fi

          PRERELEASE="$(
            echo "$RELEASE_JSON" |
              jq -r '.prerelease'
          )"

          UPSTREAM_URL="$(
            echo "$RELEASE_JSON" |
              jq -r '.html_url'
          )"

          echo "Upstream release: $TAG"
          echo "Prerelease: $PRERELEASE"
          echo "URL: $UPSTREAM_URL"
          echo "Force rebuild: ${FORCE_REBUILD:-false}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "upstream_url=$UPSTREAM_URL" >> "$GITHUB_OUTPUT"

          if [ "${FORCE_REBUILD:-false}" = "true" ]; then
            echo "Force rebuild requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"

          elif gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then

            echo "Release $TAG already exists."
            echo "should_build=false" >> "$GITHUB_OUTPUT"

          else
            echo "Release $TAG has not been built."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ needs.check-release.outputs.tag }}

    needs:
      - check-release

    if: needs.check-release.outputs.should_build == 'true'

    runs-on: macos-26-intel

    env:
      NUVIO_TAG: ${{ needs.check-release.outputs.tag }}

    steps:
      - name: Show build environment
        run: |
          set -euo pipefail

          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sysctl hw.memsize || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone official Nuvio release
        run: |
          set -euo pipefail

          git clone \
            --branch "$NUVIO_TAG" \
            --single-branch \
            --depth 1 \
            --recurse-submodules \
            https://github.com/NuvioMedia/NuvioMobile.git \
            upstream

          cd upstream

          git submodule update \
            --init \
            --recursive

          echo "Nuvio commit:"
          git rev-parse HEAD

          echo "MPVKit commit:"
          git -C MPVKit rev-parse HEAD

      - name: Discover expected runtime configuration
        working-directory: upstream
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          build_file = Path("composeApp/build.gradle.kts")

          if not build_file.exists():
              raise SystemExit(
                  "composeApp/build.gradle.kts was not found."
              )

          text = build_file.read_text(encoding="utf-8")

          keys = set()

          patterns = [
              r'props\.getProperty\(\s*"([^"]+)"',
              r'runtimeConfigValue\(\s*"([^"]+)"',
          ]

          for pattern in patterns:
              for match in re.finditer(pattern, text):
                  keys.add(match.group(1))

          ignored = {
              "NUVIO_ANDROID_DISTRIBUTION",
              "NUVIO_IOS_DISTRIBUTION",
          }

          keys -= ignored
          keys = sorted(keys)

          Path("../expected-runtime-keys.json").write_text(
              json.dumps(keys, indent=2) + "\n",
              encoding="utf-8"
          )

          print(
              f"Found {len(keys)} expected runtime properties:"
          )

          for key in keys:
              print(f"  {key}")
          PY

      - name: Download official Full APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          APK_DIR="$RUNNER_TEMP/nuvio-apk"

          mkdir -p "$APK_DIR"

          RELEASE_JSON="$(
            gh api \
              "repos/NuvioMedia/NuvioMobile/releases/tags/$NUVIO_TAG"
          )"

          echo "Available APK assets:"

          echo "$RELEASE_JSON" |
            jq -r '
              .assets[]
              | select(
                  .name
                  | ascii_downcase
                  | endswith(".apk")
                )
              | "\(.name) - \(.size) bytes"
            '

          APK_NAME="$(
            echo "$RELEASE_JSON" |
              jq -r '
                [
                  .assets[]
                  | select(
                      (.name | ascii_downcase | endswith(".apk"))
                      and
                      (.name | test("full"; "i"))
                    )
                ]
                | sort_by(.size)
                | .[0].name
              '
          )"

          if [ -z "$APK_NAME" ] ||
             [ "$APK_NAME" = "null" ]; then
            echo "No Full APK found for $NUVIO_TAG."
            exit 1
          fi

          echo "Selected APK:"
          echo "$APK_NAME"

          gh release download "$NUVIO_TAG" \
            --repo NuvioMedia/NuvioMobile \
            --pattern "$APK_NAME" \
            --dir "$APK_DIR"

          APK_PATH="$APK_DIR/$APK_NAME"

          test -f "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "OFFICIAL_APK=$APK_PATH" \
            >> "$GITHUB_ENV"

      - name: Download JADX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          JADX_DIR="$RUNNER_TEMP/jadx"

          mkdir -p "$JADX_DIR"

          RELEASE_JSON="$(
            gh api \
              repos/skylot/jadx/releases/latest
          )"

          JADX_URL="$(
            echo "$RELEASE_JSON" |
              jq -r '
                .assets[]
                | select(
                    (.name | test("^jadx-[0-9].*\\.zip$"))
                    and
                    (.name | contains("gui") | not)
                    and
                    (.name | contains("win") | not)
                  )
                | .browser_download_url
              ' |
              head -1
          )"

          if [ -z "$JADX_URL" ] ||
             [ "$JADX_URL" = "null" ]; then
            echo "Could not find JADX archive."
            exit 1
          fi

          curl \
            --fail \
            --location \
            --retry 3 \
            "$JADX_URL" \
            --output "$RUNNER_TEMP/jadx.zip"

          unzip \
            -q \
            "$RUNNER_TEMP/jadx.zip" \
            -d "$JADX_DIR"

          chmod +x \
            "$JADX_DIR/bin/jadx"

          "$JADX_DIR/bin/jadx" --version

          echo "JADX_BIN=$JADX_DIR/bin/jadx" \
            >> "$GITHUB_ENV"

      - name: Decompile official APK
        run: |
          set -u

          OUTPUT="$RUNNER_TEMP/jadx-output"
          JADX_LOG="$RUNNER_TEMP/jadx.log"

          rm -rf "$OUTPUT"

          set +e

          "$JADX_BIN" \
            --no-res \
            --show-bad-code \
            --threads-count 4 \
            --output-dir "$OUTPUT" \
            "$OFFICIAL_APK" \
            2>&1 | tee "$JADX_LOG"

          JADX_STATUS=${PIPESTATUS[0]}

          set -e

          echo
          echo "JADX exit code: $JADX_STATUS"

          if [ "$JADX_STATUS" -ne 0 ]; then
            echo "JADX completed with partial decompilation errors."
            echo "Continuing because usable output may still exist."
          fi

          if [ ! -d "$OUTPUT" ]; then
            echo "JADX produced no output directory."
            exit 1
          fi

          SOURCE_COUNT="$(
            find "$OUTPUT" \
              -type f \
              \( -name '*.java' -o -name '*.kt' \) \
              | wc -l \
              | tr -d ' '
          )"

          echo "Decompiled source files: $SOURCE_COUNT"

          if [ "$SOURCE_COUNT" -lt 1 ]; then
            echo "JADX produced no usable source files."
            exit 1
          fi

          echo "JADX_OUTPUT=$OUTPUT" \
            >> "$GITHUB_ENV"

      - name: Extract DEX strings
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import struct
          import zipfile
          from pathlib import Path

          apk = Path(os.environ["OFFICIAL_APK"])

          output = (
              Path(os.environ["RUNNER_TEMP"])
              / "dex-strings.txt"
          )

          def read_uleb128(data, offset):
              result = 0
              shift = 0

              while True:
                  value = data[offset]
                  offset += 1

                  result |= (
                      value & 0x7f
                  ) << shift

                  if value < 0x80:
                      return result, offset

                  shift += 7

          def extract_dex_strings(data):
              count, table = struct.unpack_from(
                  "<II",
                  data,
                  0x38
              )

              values = []

              for index in range(count):
                  offset = struct.unpack_from(
                      "<I",
                      data,
                      table + index * 4
                  )[0]

                  _, position = read_uleb128(
                      data,
                      offset
                  )

                  end = data.find(
                      b"\x00",
                      position
                  )

                  raw = data[position:end]

                  try:
                      value = raw.decode("utf-8")
                  except UnicodeDecodeError:
                      value = raw.decode(
                          "latin-1",
                          errors="ignore"
                      )

                  values.append(value)

              return values

          values = set()

          with zipfile.ZipFile(apk, "r") as archive:

              dex_files = sorted(
                  name
                  for name in archive.namelist()
                  if re.fullmatch(
                      r"classes\d*\.dex",
                      name
                  )
              )

              if not dex_files:
                  raise SystemExit(
                      "No classes*.dex files found."
                  )

              print("DEX files:")

              for name in dex_files:
                  print(f"  {name}")

                  values.update(
                      extract_dex_strings(
                          archive.read(name)
                      )
                  )

          output.write_text(
              "\n".join(sorted(values)) + "\n",
              encoding="utf-8"
          )

          print()
          print(
              f"Extracted {len(values)} unique DEX strings."
          )
          PY

      - name: Reverse engineer runtime configuration
        working-directory: upstream
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          runner = Path(os.environ["RUNNER_TEMP"])

          expected = json.loads(
              Path(
                  "../expected-runtime-keys.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          dex_strings = (
              runner
              / "dex-strings.txt"
          ).read_text(
              encoding="utf-8",
              errors="ignore"
          ).splitlines()

          dex_set = set(dex_strings)

          jadx_root = Path(
              os.environ["JADX_OUTPUT"]
          )

          source_files = (
              list(jadx_root.rglob("*.java"))
              +
              list(jadx_root.rglob("*.kt"))
          )

          source_texts = []

          for path in source_files:
              try:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="ignore"
                  )
              except Exception:
                  continue

              source_texts.append(
                  (path, text)
              )

          def mask(value):
              if value:
                  print(
                      f"::add-mask::{value}"
                  )

          def first_dex(predicate):
              for value in dex_strings:
                  if predicate(value):
                      return value

              return None

          def find_exact_url(fragment):
              candidates = [
                  value
                  for value in dex_strings
                  if value.startswith(
                      ("http://", "https://")
                  )
                  and fragment.lower()
                      in value.lower()
              ]

              if not candidates:
                  return None

              return min(
                  candidates,
                  key=len
              )

          def find_jwt():
              pattern = re.compile(
                  r"^eyJ[A-Za-z0-9_-]+\."
                  r"eyJ[A-Za-z0-9_-]+\."
                  r"[A-Za-z0-9_-]+$"
              )

              candidates = [
                  value
                  for value in dex_strings
                  if len(value) > 100
                  and pattern.match(value)
              ]

              for value in candidates:
                  if value.startswith(
                      "eyJhbGciOiJIUzI1Ni"
                  ):
                      return value

              if len(candidates) == 1:
                  return candidates[0]

              return None

          STRING_RE = re.compile(
              r'"((?:\\.|[^"\\])*)"'
          )

          def literals_from_text(text):
              result = []

              for match in STRING_RE.finditer(text):
                  raw = match.group(1)

                  try:
                      value = bytes(
                          raw,
                          "utf-8"
                      ).decode(
                          "unicode_escape"
                      )
                  except Exception:
                      value = raw

                  result.append(value)

              return result

          def nearby_literals(markers):
              markers = [
                  marker.lower()
                  for marker in markers
              ]

              matches = []

              for path, text in source_texts:
                  lower = text.lower()

                  if not any(
                      marker in lower
                      for marker in markers
                  ):
                      continue

                  literals = [
                      value
                      for value in literals_from_text(text)
                      if value in dex_set
                  ]

                  matches.append(
                      (
                          path,
                          literals
                      )
                  )

              return matches

          def opaque_candidates(
              markers,
              regex,
              exclusions=()
          ):
              pattern = re.compile(regex)

              exclusions = {
                  value.lower()
                  for value in exclusions
              }

              candidates = {}

              for path, literals in nearby_literals(
                  markers
              ):
                  for value in literals:
                      if value.lower() in exclusions:
                          continue

                      if pattern.fullmatch(value):
                          candidates.setdefault(
                              value,
                              []
                          ).append(path)

              return candidates

          recovered = {}
          evidence = {}

          def put(key, value, reason):
              if key not in expected:
                  return

              if not value:
                  return

              recovered[key] = value
              evidence[key] = reason

              mask(value)

          # ------------------------------------------------------------
          # Nuvio backend
          # ------------------------------------------------------------

          put(
              "NUVIO_SUPABASE_URL",
              find_exact_url(
                  "api-two.nuvioapp.space"
              ),
              "matched Nuvio api-two endpoint"
          )

          put(
              "NUVIO_SUPABASE_FALLBACK_URL",
              find_exact_url(
                  "api.nuvio.tv"
              ),
              "matched Nuvio fallback endpoint"
          )

          put(
              "NUVIO_SUPABASE_ANON_KEY",
              find_jwt(),
              "matched client-side JWT"
          )

          # ------------------------------------------------------------
          # Sentry
          # ------------------------------------------------------------

          sentry = first_dex(
              lambda value:
                  value.startswith("https://")
                  and
                  "sentry.io" in value.lower()
                  and
                  "@" in value
          )

          put(
              "SENTRY_DSN",
              sentry,
              "matched Sentry DSN"
          )

          # ------------------------------------------------------------
          # Trakt
          # ------------------------------------------------------------

          put(
              "TRAKT_REDIRECT_URI",
              first_dex(
                  lambda value:
                      value == "nuvio://auth/trakt"
              ),
              "matched Trakt redirect URI"
          )

          trakt_candidates = opaque_candidates(
              markers=[
                  "api.trakt.tv",
                  "trakt.tv/oauth",
                  "nuvio://auth/trakt",
                  "client_secret",
                  "client_id",
              ],
              regex=r"[0-9a-fA-F]{64}",
          )

          trakt_id = None
          trakt_secret = None

          for path, text in source_texts:
              lower = text.lower()

              if (
                  "trakt" not in lower
                  and
                  "api.trakt.tv" not in lower
              ):
                  continue

              literals = [
                  match.group(1)
                  for match in STRING_RE.finditer(
                      text
                  )
                  if re.fullmatch(
                      r"[0-9a-fA-F]{64}",
                      match.group(1)
                  )
              ]

              literals = list(
                  dict.fromkeys(literals)
              )

              for value in literals:
                  positions = [
                      match.start()
                      for match in re.finditer(
                          re.escape(value),
                          text
                      )
                  ]

                  for position in positions:
                      window = text[
                          max(
                              0,
                              position - 1500
                          ):
                          position + 1500
                      ].lower()

                      if (
                          "client_secret"
                          in window
                          and
                          trakt_secret is None
                      ):
                          trakt_secret = value

                      if (
                          "client_id"
                          in window
                          and
                          trakt_id is None
                      ):
                          trakt_id = value

          put(
              "TRAKT_CLIENT_ID",
              trakt_id,
              "Trakt OAuth call-site"
          )

          put(
              "TRAKT_CLIENT_SECRET",
              trakt_secret,
              "Trakt token-exchange call-site"
          )

          # ------------------------------------------------------------
          # Simkl
          # ------------------------------------------------------------

          put(
              "SIMKL_REDIRECT_URI",
              first_dex(
                  lambda value:
                      value == "nuvio://auth/simkl"
              ),
              "matched Simkl redirect URI"
          )

          put(
              "SIMKL_APP_NAME",
              first_dex(
                  lambda value:
                      value.lower() == "nuvio"
              ),
              "matched Simkl app name"
          )

          simkl_candidates = opaque_candidates(
              markers=[
                  "simkl.com/oauth",
                  "api.simkl.com",
                  "nuvio://auth/simkl",
              ],
              regex=r"[0-9a-fA-F]{64}",
              exclusions=[
                  trakt_id or "",
                  trakt_secret or "",
              ],
          )

          simkl_id = None

          if len(
              simkl_candidates
          ) == 1:
              simkl_id = next(
                  iter(simkl_candidates)
              )

          put(
              "SIMKL_CLIENT_ID",
              simkl_id,
              "Simkl OAuth call-site"
          )

          # ------------------------------------------------------------
          # Premiumize
          #
          # Kotlin may inline PremiumizeConfig.CLIENT_ID, meaning the
          # numeric value is no longer located in the same decompiled
          # source file as the Premiumize URL.
          #
          # Resolve in layers:
          #
          # 1. Direct Premiumize-specific source context.
          # 2. Debrid/device-auth source context.
          # 3. Verified current ID only when the SAME APK still contains
          #    that ID in its DEX.
          #
          # The fallback is intentionally not unconditional. If Nuvio
          # changes the ID and 885913 disappears, extraction fails rather
          # than silently compiling the old credential.
          # ------------------------------------------------------------

          premiumize_id = None

          premiumize_markers = [
              "premiumize_client_id",
              "premiumize sign-in is missing",
              "premiumize.me/token",
              "premiumize.me/api/",
              "premiumizedeviceauthorizationdto",
              "premiumizedevicetokendto",
          ]

          premiumize_direct = opaque_candidates(
              markers=premiumize_markers,
              regex=r"[0-9]{4,12}",
          )

          if len(premiumize_direct) == 1:
              premiumize_id = next(
                  iter(premiumize_direct)
              )

          if premiumize_id is None:
              scored = {}

              for path, text in source_texts:
                  lower = text.lower()

                  premiumize_context = (
                      "premiumize" in lower
                      or
                      "features.debrid" in lower
                      or
                      "features/debrid" in str(
                          path
                      ).lower()
                  )

                  auth_context = any(
                      marker in lower
                      for marker in [
                          "device_code",
                          "client_id",
                          "token",
                          "authorization",
                          "premiumize_client_id",
                          "missing_client_id",
                      ]
                  )

                  if not (
                      premiumize_context
                      and
                      auth_context
                  ):
                      continue

                  for value in literals_from_text(
                      text
                  ):
                      if not re.fullmatch(
                          r"[0-9]{4,12}",
                          value
                      ):
                          continue

                      if value not in dex_set:
                          continue

                      score = 0

                      if "premiumize" in lower:
                          score += 4

                      if (
                          "premiumize_client_id"
                          in lower
                      ):
                          score += 8

                      if (
                          "premiumize sign-in "
                          "is missing"
                          in lower
                      ):
                          score += 8

                      if "device_code" in lower:
                          score += 3

                      if "client_id" in lower:
                          score += 3

                      if (
                          "premiumize.me/token"
                          in lower
                      ):
                          score += 5

                      if (
                          "premiumizedevice"
                          in lower
                      ):
                          score += 5

                      scored[value] = max(
                          scored.get(value, 0),
                          score
                      )

              if scored:
                  best_score = max(
                      scored.values()
                  )

                  best = [
                      value
                      for value, score
                      in scored.items()
                      if score == best_score
                  ]

                  if (
                      len(best) == 1
                      and
                      best_score >= 5
                  ):
                      premiumize_id = best[0]

          # Compatibility fallback for the currently verified official
          # Nuvio Full configuration.
          #
          # IMPORTANT:
          # This value is accepted only if it is physically present in
          # the APK currently being analyzed.
          #
          # If a future Nuvio release changes Premiumize's client ID,
          # this check stops matching and the workflow must either
          # discover the replacement dynamically above or fail safely.
          if premiumize_id is None:
              verified_current_id = "885913"

              if (
                  verified_current_id
                  in dex_set
                  and
                  "PREMIUMIZE_CLIENT_ID"
                  in dex_set
                  and
                  any(
                      "premiumize.me"
                      in value.lower()
                      for value in dex_strings
                  )
              ):
                  premiumize_id = (
                      verified_current_id
                  )

                  premiumize_reason = (
                      "verified Premiumize ID present "
                      "in current APK DEX"
                  )
              else:
                  premiumize_reason = None
          else:
              premiumize_reason = (
                  "Premiumize auth/debrid call-site"
              )

          put(
              "PREMIUMIZE_CLIENT_ID",
              premiumize_id,
              premiumize_reason
              or
              "Premiumize client ID"
          )

          # ------------------------------------------------------------
          # IntroDB
          # ------------------------------------------------------------

          put(
              "INTRODB_API_URL",
              find_exact_url(
                  "api.introdb.app"
              ),
              "matched IntroDB endpoint"
          )

          # ------------------------------------------------------------
          # IMDb
          # ------------------------------------------------------------

          put(
              "IMDB_RATINGS_API_BASE_URL",
              find_exact_url(
                  "seriesgraph.com"
              ),
              "matched SeriesGraph rating service"
          )

          put(
              "IMDB_TAPFRAME_API_BASE_URL",
              find_exact_url(
                  "imdb.tapframe.space"
              ),
              "matched Tapframe IMDb service"
          )

          # ------------------------------------------------------------
          # Community
          # ------------------------------------------------------------

          contributions = first_dex(
              lambda value:
                  value.startswith("https://")
                  and
                  "gitserver.tapframe.space"
                  in value
                  and
                  "unique-contributions"
                  in value
          )

          put(
              "CONTRIBUTIONS_URL",
              contributions,
              "matched contribution endpoint"
          )

          donation_root = find_exact_url(
              "donate.nuvio.tv"
          )

          put(
              "DONATIONS_BASE_URL",
              donation_root,
              "matched donation service"
          )

          put(
              "DONATIONS_DONATE_URL",
              donation_root,
              "matched donation page"
          )

          # ------------------------------------------------------------
          # Validate
          # ------------------------------------------------------------

          missing = [
              key
              for key in expected
              if not recovered.get(key)
          ]

          print()
          print(
              "=============================================="
          )
          print(
              "RUNTIME CONFIGURATION REPORT"
          )
          print(
              "=============================================="
          )

          print()
          print(
              f"Expected:  {len(expected)}"
          )
          print(
              f"Recovered: {len(recovered)}"
          )

          print()
          print("Mappings:")

          for key in expected:
              if key in recovered:
                  print(
                      f"  ✓ {key}"
                      f"  [{evidence[key]}]"
                  )
              else:
                  print(
                      f"  ✗ {key}"
                  )

          if missing:
              print()
              print(
                  "=============================================="
              )
              print(
                  "CONFIGURATION EXTRACTION FAILED"
              )
              print(
                  "=============================================="
              )

              print()
              print(
                  "The following properties could "
                  "not be mapped confidently:"
              )

              for key in missing:
                  print(
                      f"  - {key}"
                  )

              print()
              print(
                  "The expensive iOS build has NOT started."
              )

              raise SystemExit(1)

          # ------------------------------------------------------------
          # Generate local.properties
          # ------------------------------------------------------------

          def escape(value):
              return (
                  value
                  .replace("\\", "\\\\")
                  .replace("\r", "")
                  .replace("\n", "\\n")
              )

          output = Path(
              "local.properties"
          )

          with output.open(
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "# Automatically generated from "
                  "the official Nuvio Full APK.\n"
              )

              file.write(
                  f"# Nuvio release: "
                  f"{os.environ['NUVIO_TAG']}\n\n"
              )

              for key in expected:
                  file.write(
                      f"{key}="
                      f"{escape(recovered[key])}\n"
                  )

              file.write(
                  "\n"
                  "NUVIO_IOS_DISTRIBUTION=appstore\n"
              )

          os.chmod(
              output,
              0o600
          )

          print()
          print(
              "local.properties generated successfully."
          )
          PY

      - name: Validate generated local.properties
        working-directory: upstream
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          from pathlib import Path

          expected = json.loads(
              Path(
                  "../expected-runtime-keys.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          properties = {}

          for line in Path(
              "local.properties"
          ).read_text(
              encoding="utf-8"
          ).splitlines():

              line = line.strip()

              if (
                  not line
                  or
                  line.startswith("#")
                  or
                  "=" not in line
              ):
                  continue

              key, value = line.split(
                  "=",
                  1
              )

              properties[key] = value

          missing = [
              key
              for key in expected
              if not properties.get(key)
          ]

          if missing:
              print(
                  "Generated local.properties "
                  "is incomplete:"
              )

              for key in missing:
                  print(
                      f"  - {key}"
                  )

              raise SystemExit(1)

          print(
              f"Validated {len(expected)} "
              "runtime configuration properties."
          )

          print()
          print("Configured keys:")

          for key in sorted(properties):
              print(
                  f"  {key}"
              )
          PY

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ needs.check-release.outputs.tag }}-${{ hashFiles('upstream/**/*.gradle.kts', 'upstream/**/*.gradle', 'upstream/gradle/libs.versions.toml', 'upstream/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-${{ needs.check-release.outputs.tag }}-
            gradle-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.check-release.outputs.tag }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure Gradle memory
        working-directory: upstream
        run: |
          set -euo pipefail

          sed -i '' \
            's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx10240M -Xms1024M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m/' \
            gradle.properties

          sed -i '' \
            's/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2048M/' \
            gradle.properties

          sed -i '' \
            's/^kotlin\.native\.jvmArgs=.*/kotlin.native.jvmArgs=-Xmx10240M/' \
            gradle.properties

          if grep -q \
              '^org\.gradle\.workers\.max=' \
              gradle.properties; then

            sed -i '' \
              's/^org\.gradle\.workers\.max=.*/org.gradle.workers.max=1/' \
              gradle.properties

          else
            echo \
              'org.gradle.workers.max=1' \
              >> gradle.properties
          fi

          if grep -q \
              '^org\.gradle\.parallel=' \
              gradle.properties; then

            sed -i '' \
              's/^org\.gradle\.parallel=.*/org.gradle.parallel=false/' \
              gradle.properties

          else
            echo \
              'org.gradle.parallel=false' \
              >> gradle.properties
          fi

      - name: Make Gradle wrapper executable
        run: |
          chmod +x upstream/gradlew

      - name: Verify Gradle
        working-directory: upstream
        run: |
          ./gradlew --version

      - name: Stop existing Gradle daemons
        working-directory: upstream
        run: |
          ./gradlew --stop || true

      - name: Build unsigned iOS app
        working-directory: upstream
        run: |
          set -o pipefail

          BUILD_LOG="$RUNNER_TEMP/xcodebuild.log"

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/nuvio-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 |
            tee "$BUILD_LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "BUILD FAILED"

            grep -n -E \
              "FAILURE:|What went wrong|Execution failed|Exception|OutOfMemory|heap space|Compilation failed|error:|ERROR|e: " \
              "$BUILD_LOG" |
              tail -300 ||
              true

            tail -400 \
              "$BUILD_LOG" ||
              true

            exit "$BUILD_STATUS"
          fi

      - name: Stop Gradle daemon
        if: always()
        working-directory: upstream
        run: |
          ./gradlew --stop || true

      - name: Locate built app
        id: app
        run: |
          set -euo pipefail

          APP_PATH="$(
            find \
              "$RUNNER_TEMP/nuvio-derived/Build/Products/Release-iphoneos" \
              -maxdepth 1 \
              -type d \
              -name 'Nuvio.app' \
              -print \
              -quit
          )"

          if [ -z "$APP_PATH" ]; then
            echo "Nuvio.app was not found."
            exit 1
          fi

          echo "app_path=$APP_PATH" \
            >> "$GITHUB_OUTPUT"

      - name: Inspect app metadata
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app_path }}"
          PLIST="$APP/Info.plist"

          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST"

          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST"

          echo "Minimum iOS:"
          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$PLIST" ||
            true

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app_path }}"

          PACKAGE_DIR="$RUNNER_TEMP/nuvio-package"

          rm -rf "$PACKAGE_DIR"

          mkdir -p \
            "$PACKAGE_DIR/Payload"

          cp -R \
            "$APP" \
            "$PACKAGE_DIR/Payload/Nuvio.app"

          IPA="$RUNNER_TEMP/Nuvio-${NUVIO_TAG}.ipa"

          cd "$PACKAGE_DIR"

          /usr/bin/zip \
            -qry \
            "$IPA" \
            Payload

          ls -lh "$IPA"

          echo "ipa=$IPA" \
            >> "$GITHUB_OUTPUT"

      - name: Validate IPA
        run: |
          set -euo pipefail

          IPA="${{ steps.package.outputs.ipa }}"

          unzip -t "$IPA"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_URL: ${{ needs.check-release.outputs.upstream_url }}
          IS_PRERELEASE: ${{ needs.check-release.outputs.prerelease }}
        run: |
          set -euo pipefail

          IPA="${{ steps.package.outputs.ipa }}"

          if gh release view "$NUVIO_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              >/dev/null 2>&1; then

            gh release delete "$NUVIO_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes
          fi

          NOTES="$(cat <<EOF
          Unofficial unsigned iOS build of Nuvio ${NUVIO_TAG}.

          Upstream:
          ${UPSTREAM_URL}

          Built automatically from the official
          NuvioMedia/NuvioMobile ${NUVIO_TAG} source.

          Runtime configuration is recovered from the matching official
          Full Android APK and validated before the iOS build begins.

          The IPA is unsigned and intended for SideStore or Sideloadly.
          EOF
          )"

          if [ "$IS_PRERELEASE" = "true" ]; then

            gh release create "$NUVIO_TAG" \
              "$IPA#Nuvio-${NUVIO_TAG}.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio ${NUVIO_TAG} iOS" \
              --notes "$NOTES" \
              --prerelease

          else

            gh release create "$NUVIO_TAG" \
              "$IPA#Nuvio-${NUVIO_TAG}.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio ${NUVIO_TAG} iOS" \
              --notes "$NOTES"

          fi

  update-source:
    name: Update SideStore source

    needs:
      - check-release
      - build

    if: >-
      always() &&
      needs.check-release.result == 'success' &&
      (
        needs.build.result == 'success' ||
        needs.build.result == 'skipped'
      )

    runs-on: ubuntu-latest

    env:
      NUVIO_TAG: ${{ needs.check-release.outputs.tag }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p downloaded

          gh release download "$NUVIO_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.ipa" \
            --dir downloaded

          IPA="$(
            find downloaded \
              -maxdepth 1 \
              -type f \
              -name '*.ipa' \
              -print \
              -quit
          )"

          if [ -z "$IPA" ]; then
            echo "No IPA found."
            exit 1
          fi

          echo "IPA_PATH=$IPA" \
            >> "$GITHUB_ENV"

      - name: Extract IPA metadata
        id: metadata
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import plistlib
          import zipfile

          ipa = os.environ["IPA_PATH"]

          with zipfile.ZipFile(ipa, "r") as archive:

              plists = [
                  name
                  for name in archive.namelist()
                  if
                  name.startswith("Payload/")
                  and
                  name.count("/") == 2
                  and
                  name.endswith(
                      ".app/Info.plist"
                  )
              ]

              if not plists:
                  raise RuntimeError(
                      "App Info.plist not found."
                  )

              info = plistlib.loads(
                  archive.read(
                      plists[0]
                  )
              )

          values = {
              "bundle_id":
                  info["CFBundleIdentifier"],

              "version":
                  info[
                      "CFBundleShortVersionString"
                  ],

              "build":
                  info["CFBundleVersion"],

              "min_os":
                  info.get(
                      "MinimumOSVersion",
                      "16.1"
                  ),

              "size":
                  os.path.getsize(ipa),
          }

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as output:

              for key, value in values.items():
                  output.write(
                      f"{key}={value}\n"
                  )
          PY

      - name: Get upstream release info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            "repos/NuvioMedia/NuvioMobile/releases/tags/$NUVIO_TAG" \
            > "$RUNNER_TEMP/upstream-release.json"

      - name: Update source.json
        env:
          BUNDLE_ID: ${{ steps.metadata.outputs.bundle_id }}
          APP_VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_VERSION: ${{ steps.metadata.outputs.build }}
          MIN_OS: ${{ steps.metadata.outputs.min_os }}
          IPA_SIZE: ${{ steps.metadata.outputs.size }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          repo = os.environ[
              "GITHUB_REPOSITORY"
          ]

          tag = os.environ[
              "NUVIO_TAG"
          ]

          upstream = json.loads(
              (
                  Path(
                      os.environ[
                          "RUNNER_TEMP"
                      ]
                  )
                  / "upstream-release.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          version = os.environ[
              "APP_VERSION"
          ]

          build = os.environ[
              "BUILD_VERSION"
          ]

          download_url = (
              f"https://github.com/"
              f"{repo}/releases/download/"
              f"{tag}/Nuvio-{tag}.ipa"
          )

          icon_url = (
              "https://raw.githubusercontent.com/"
              f"NuvioMedia/NuvioMobile/{tag}/"
              "iosApp/iosApp/Assets.xcassets/"
              "AppIcon.appiconset/"
              "app-icon-1024.png"
          )

          new_version = {
              "version":
                  version,

              "buildVersion":
                  build,

              "date":
                  upstream.get(
                      "published_at"
                  ),

              "localizedDescription":
                  upstream.get("body")
                  or f"Nuvio {version}",

              "downloadURL":
                  download_url,

              "size":
                  int(
                      os.environ[
                          "IPA_SIZE"
                      ]
                  ),

              "minOSVersion":
                  os.environ[
                      "MIN_OS"
                  ],
          }

          path = Path(
              "source.json"
          )

          if path.exists():

              source = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )

          else:

              source = {
                  "name":
                      "Nuvio iOS (Unofficial)",

                  "subtitle":
                      "Automatic iOS builds of Nuvio",

                  "description":
                      "Unofficial SideStore source "
                      "built automatically from "
                      "official Nuvio releases.",

                  "website":
                      f"https://github.com/{repo}",

                  "iconURL":
                      icon_url,

                  "tintColor":
                      "7B2FF7",

                  "news":
                      [],

                  "apps": [
                      {
                          "name":
                              "Nuvio",

                          "bundleIdentifier":
                              os.environ[
                                  "BUNDLE_ID"
                              ],

                          "developerName":
                              "Nuvio",

                          "subtitle":
                              "Watch your library, anywhere",

                          "localizedDescription":
                              "Unofficial iOS build "
                              "generated automatically "
                              "from official Nuvio source.",

                          "iconURL":
                              icon_url,

                          "tintColor":
                              "7B2FF7",

                          "category":
                              "entertainment",

                          "versions":
                              [],
                      }
                  ],
              }

          source["iconURL"] = icon_url
          source["website"] = \
              f"https://github.com/{repo}"

          app = source["apps"][0]

          app[
              "bundleIdentifier"
          ] = os.environ["BUNDLE_ID"]

          app["iconURL"] = icon_url

          versions = app.setdefault(
              "versions",
              []
          )

          versions = [
              item
              for item in versions
              if not (
                  item.get(
                      "version"
                  ) == version
                  and
                  str(
                      item.get(
                          "buildVersion"
                      )
                  ) == str(build)
              )
          ]

          versions.insert(
              0,
              new_version
          )

          app[
              "versions"
          ] = versions

          path.write_text(
              json.dumps(
                  source,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Validate source.json
        run: |
          set -euo pipefail

          python3 \
            -m json.tool \
            source.json \
            >/dev/null

          jq -r \
            '.apps[0].versions[] |
            "\(.version) (\(.buildVersion))"' \
            source.json

      - name: Commit source.json
        run: |
          set -euo pipefail

          if git diff \
                --quiet \
                -- source.json &&
             git ls-files \
                --error-unmatch \
                source.json \
                >/dev/null 2>&1; then

            echo "source.json is already current."
            exit 0
          fi

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add source.json

          git commit \
            -m \
            "Update SideStore source for Nuvio $NUVIO_TAG"

          git push origin main

      - name: Show SideStore source URL
        run: |
          echo
          echo "SideStore source:"
          echo
          echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/source.json"
