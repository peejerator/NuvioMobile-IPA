name: Build Nuvio iOS IPA

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream Nuvio tag to build. Leave blank for latest release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nuvio-ios-builder
  cancel-in-progress: false

jobs:
  check-release:
    name: Check upstream release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_build: ${{ steps.release.outputs.should_build }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      upstream_url: ${{ steps.release.outputs.upstream_url }}

    steps:
      - name: Determine Nuvio version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_TAG:-}" ]; then
            TAG="$MANUAL_TAG"

            RELEASE_JSON="$(gh api \
              "repos/NuvioMedia/NuvioMobile/releases/tags/$TAG")"
          else
            RELEASE_JSON="$(gh api \
              repos/NuvioMedia/NuvioMobile/releases/latest)"

            TAG="$(echo "$RELEASE_JSON" | jq -r '.tag_name')"
          fi

          PRERELEASE="$(echo "$RELEASE_JSON" | jq -r '.prerelease')"
          UPSTREAM_URL="$(echo "$RELEASE_JSON" | jq -r '.html_url')"

          echo "Upstream release: $TAG"
          echo "Prerelease: $PRERELEASE"
          echo "URL: $UPSTREAM_URL"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "upstream_url=$UPSTREAM_URL" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Release $TAG already exists in this repository."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG has not been built yet."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ needs.check-release.outputs.tag }}
    needs: check-release

    if: needs.check-release.outputs.should_build == 'true'

    runs-on: macos-15

    env:
      NUVIO_TAG: ${{ needs.check-release.outputs.tag }}

    steps:
      - name: Show build environment
        run: |
          set -euo pipefail

          echo "macOS:"
          sw_vers

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "Hardware:"
          system_profiler SPHardwareDataType || true

          echo
          echo "Memory:"
          sysctl hw.memsize || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone official Nuvio release
        run: |
          set -euo pipefail

          git clone \
            --branch "$NUVIO_TAG" \
            --single-branch \
            --depth 1 \
            --recurse-submodules \
            https://github.com/NuvioMedia/NuvioMobile.git \
            upstream

          cd upstream

          git submodule update --init --recursive

          echo
          echo "Nuvio commit:"
          git rev-parse HEAD

          echo
          echo "MPVKit commit:"
          git -C MPVKit rev-parse HEAD

      - name: Show Nuvio version
        run: |
          set -euo pipefail

          if [ -f upstream/iosApp/Configuration/Version.xcconfig ]; then
            cat upstream/iosApp/Configuration/Version.xcconfig
          else
            echo "Version.xcconfig not found."
          fi

      - name: Configure Gradle memory for GitHub runner
        working-directory: upstream
        run: |
          set -euo pipefail

          echo "Original Gradle settings:"
          cat gradle.properties

          echo
          echo "Adjusting memory limits for GitHub Actions..."

          sed -i '' \
            's/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2048M/' \
            gradle.properties

          sed -i '' \
            's/^kotlin\.native\.jvmArgs=.*/kotlin.native.jvmArgs=-Xmx3072M/' \
            gradle.properties

          sed -i '' \
            's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m/' \
            gradle.properties

          echo
          echo "GitHub Actions Gradle settings:"
          cat gradle.properties

      - name: Make Gradle wrapper executable
        run: |
          set -euo pipefail

          chmod +x upstream/gradlew

      - name: Verify Gradle
        working-directory: upstream
        run: |
          set -euo pipefail

          ./gradlew --version

      - name: Build unsigned iOS app
        working-directory: upstream
        env:
          GRADLE_OPTS: >-
            -Xmx3072M
            -Dfile.encoding=UTF-8
            -XX:MaxMetaspaceSize=1024m
          KOTLIN_DAEMON_JVMARGS: "-Xmx2048M"
        run: |
          set -o pipefail

          BUILD_LOG="$RUNNER_TEMP/xcodebuild.log"

          echo "Building Nuvio $NUVIO_TAG..."
          echo
          echo "Full build log:"
          echo "$BUILD_LOG"
          echo

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/nuvio-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee "$BUILD_LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "=================================================="
            echo "BUILD FAILED"
            echo "=================================================="
            echo

            echo "Searching build log for Gradle/Kotlin errors..."
            echo

            grep -n -E \
              "FAILURE:|What went wrong|Execution failed|Exception|OutOfMemory|heap space|Could not reserve|Could not create|error:|ERROR|e: " \
              "$BUILD_LOG" \
              | tail -200 || true

            echo
            echo "=================================================="
            echo "Last 300 lines of complete build log"
            echo "=================================================="
            echo

            tail -300 "$BUILD_LOG" || true

            exit "$BUILD_STATUS"
          fi

      - name: Locate built app
        id: app
        run: |
          set -euo pipefail

          echo "Looking for Nuvio.app..."

          APP_PATH="$(find \
            "$RUNNER_TEMP/nuvio-derived/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -type d \
            -name 'Nuvio.app' \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "Nuvio.app was not found."
            echo
            echo "Build products:"

            if [ -d "$RUNNER_TEMP/nuvio-derived/Build/Products" ]; then
              find \
                "$RUNNER_TEMP/nuvio-derived/Build/Products" \
                -maxdepth 3 \
                -print
            fi

            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Inspect app metadata
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app_path }}"
          PLIST="$APP/Info.plist"

          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo
          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST"

          echo
          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST"

          echo
          echo "Minimum iOS:"
          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$PLIST" || true

      - name: Show embedded frameworks
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app_path }}"

          echo "Frameworks embedded in Nuvio.app:"

          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" \
              -maxdepth 2 \
              -type d \
              -print
          else
            echo "No Frameworks directory found."
          fi

          echo
          echo "App extensions:"

          if [ -d "$APP/PlugIns" ]; then
            find "$APP/PlugIns" \
              -maxdepth 2 \
              -type d \
              -print
          else
            echo "No PlugIns directory found."
          fi

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app_path }}"
          PACKAGE_DIR="$RUNNER_TEMP/nuvio-package"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"

          cp -R "$APP" "$PACKAGE_DIR/Payload/Nuvio.app"

          IPA="$RUNNER_TEMP/Nuvio-${NUVIO_TAG}.ipa"

          cd "$PACKAGE_DIR"

          /usr/bin/zip \
            -qry \
            "$IPA" \
            Payload

          echo "Created IPA:"
          ls -lh "$IPA"

          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - name: Validate IPA
        run: |
          set -euo pipefail

          IPA="${{ steps.package.outputs.ipa }}"

          echo "Testing ZIP integrity..."
          unzip -t "$IPA"

          echo
          echo "IPA size:"
          ls -lh "$IPA"

          echo
          echo "Top-level IPA contents:"
          unzip -l "$IPA" | head -100

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_URL: ${{ needs.check-release.outputs.upstream_url }}
          IS_PRERELEASE: ${{ needs.check-release.outputs.prerelease }}
        run: |
          set -euo pipefail

          IPA="${{ steps.package.outputs.ipa }}"

          NOTES="$(cat <<EOF
          Unofficial unsigned iOS build of Nuvio ${NUVIO_TAG}.

          Source:
          ${UPSTREAM_URL}

          Built automatically from the official
          NuvioMedia/NuvioMobile ${NUVIO_TAG} source code.

          The application source code is unchanged. The CI workflow lowers
          Nuvio's Gradle/Kotlin JVM memory limits so the project can build
          on a standard GitHub Actions macOS runner.

          The IPA is unsigned and intended for sideloading with tools such
          as SideStore or Sideloadly.
          EOF
          )"

          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release create "$NUVIO_TAG" \
              "$IPA#Nuvio-${NUVIO_TAG}.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio ${NUVIO_TAG} iOS" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$NUVIO_TAG" \
              "$IPA#Nuvio-${NUVIO_TAG}.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio ${NUVIO_TAG} iOS" \
              --notes "$NOTES"
          fi
