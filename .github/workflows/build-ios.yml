name: Build Nuvio iOS IPA

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream Nuvio tag to build. Leave blank for latest release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nuvio-ios-builder
  cancel-in-progress: false

jobs:
  check-release:
    name: Check upstream release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_build: ${{ steps.release.outputs.should_build }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      upstream_url: ${{ steps.release.outputs.upstream_url }}

    steps:
      - name: Determine Nuvio version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_TAG:-}" ]; then
            TAG="$MANUAL_TAG"

            RELEASE_JSON="$(gh api \
              "repos/NuvioMedia/NuvioMobile/releases/tags/$TAG")"
          else
            RELEASE_JSON="$(gh api \
              repos/NuvioMedia/NuvioMobile/releases/latest)"

            TAG="$(echo "$RELEASE_JSON" | jq -r '.tag_name')"
          fi

          PRERELEASE="$(echo "$RELEASE_JSON" | jq -r '.prerelease')"
          UPSTREAM_URL="$(echo "$RELEASE_JSON" | jq -r '.html_url')"

          echo "Upstream release: $TAG"
          echo "Prerelease: $PRERELEASE"
          echo "URL: $UPSTREAM_URL"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "upstream_url=$UPSTREAM_URL" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Release $TAG already exists in this repository."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG has not been built yet."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ needs.check-release.outputs.tag }}
    needs: check-release

    if: needs.check-release.outputs.should_build == 'true'

    # Newer macOS/Xcode SDK + 14 GB RAM.
    runs-on: macos-26-intel

    env:
      NUVIO_TAG: ${{ needs.check-release.outputs.tag }}

    steps:
      - name: Show build environment
        run: |
          set -euo pipefail

          echo "macOS:"
          sw_vers

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          echo
          echo "SDK path:"
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "Physical memory:"
          sysctl hw.memsize || true

          echo
          echo "Hardware:"
          system_profiler SPHardwareDataType || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone official Nuvio release
        run: |
          set -euo pipefail

          git clone \
            --branch "$NUVIO_TAG" \
            --single-branch \
            --depth 1 \
            --recurse-submodules \
            https://github.com/NuvioMedia/NuvioMobile.git \
            upstream

          cd upstream

          git submodule update --init --recursive

          echo
          echo "Nuvio commit:"
          git rev-parse HEAD

          echo
          echo "MPVKit commit:"
          git -C MPVKit rev-parse HEAD

      - name: Show Nuvio version
        run: |
          set -euo pipefail

          if [ -f upstream/iosApp/Configuration/Version.xcconfig ]; then
            cat upstream/iosApp/Configuration/Version.xcconfig
          else
            echo "Version.xcconfig not found."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ needs.check-release.outputs.tag }}-${{ hashFiles('upstream/**/*.gradle.kts', 'upstream/**/*.gradle', 'upstream/gradle/libs.versions.toml', 'upstream/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-${{ needs.check-release.outputs.tag }}-
            gradle-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.check-release.outputs.tag }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Create local.properties
        working-directory: upstream
        run: |
          set -euo pipefail

          touch local.properties

          echo "Created:"
          ls -l local.properties

      - name: Configure Gradle for GitHub runner
        working-directory: upstream
        run: |
          set -euo pipefail

          echo "Original memory settings:"
          grep -E \
            '^(org\.gradle\.jvmargs|kotlin\.daemon\.jvmargs|kotlin\.native\.jvmArgs|org\.gradle\.workers\.max|org\.gradle\.parallel)=' \
            gradle.properties || true

          echo
          echo "Configuring memory..."

          sed -i '' \
            's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx10240M -Xms1024M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m/' \
            gradle.properties

          sed -i '' \
            's/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2048M/' \
            gradle.properties

          sed -i '' \
            's/^kotlin\.native\.jvmArgs=.*/kotlin.native.jvmArgs=-Xmx10240M/' \
            gradle.properties

          if grep -q '^org\.gradle\.workers\.max=' gradle.properties; then
            sed -i '' \
              's/^org\.gradle\.workers\.max=.*/org.gradle.workers.max=1/' \
              gradle.properties
          else
            echo 'org.gradle.workers.max=1' >> gradle.properties
          fi

          if grep -q '^org\.gradle\.parallel=' gradle.properties; then
            sed -i '' \
              's/^org\.gradle\.parallel=.*/org.gradle.parallel=false/' \
              gradle.properties
          else
            echo 'org.gradle.parallel=false' >> gradle.properties
          fi

          echo
          echo "Final memory settings:"
          grep -E \
            '^(org\.gradle\.jvmargs|kotlin\.daemon\.jvmargs|kotlin\.native\.jvmArgs|org\.gradle\.workers\.max|org\.gradle\.parallel)=' \
            gradle.properties || true

      - name: Make Gradle wrapper executable
        run: |
          set -euo pipefail

          chmod +x upstream/gradlew

      - name: Verify Gradle
        working-directory: upstream
        run: |
          set -euo pipefail

          ./gradlew --version

      - name: Stop existing Gradle daemons
        working-directory: upstream
        run: |
          set -euo pipefail

          ./gradlew --stop || true

      - name: Build unsigned iOS app
        working-directory: upstream
        run: |
          set -o pipefail

          BUILD_LOG="$RUNNER_TEMP/xcodebuild.log"

          echo "=================================================="
          echo "Build configuration"
          echo "=================================================="

          echo "Nuvio tag: $NUVIO_TAG"

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "Memory:"
          sysctl hw.memsize || true

          echo
          echo "Starting Xcode build..."
          echo

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/nuvio-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee "$BUILD_LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "=================================================="
            echo "BUILD FAILED"
            echo "=================================================="

            echo
            echo "Memory after failure:"
            vm_stat || true

            echo
            echo "=================================================="
            echo "Relevant errors"
            echo "=================================================="
            echo

            grep -n -E \
              "FAILURE:|What went wrong|Execution failed|Exception|OutOfMemory|heap space|currently configured max heap|Compilation failed|error:|ERROR|e: " \
              "$BUILD_LOG" \
              | tail -300 || true

            echo
            echo "=================================================="
            echo "Last 400 lines"
            echo "=================================================="
            echo

            tail -400 "$BUILD_LOG" || true

            exit "$BUILD_STATUS"
          fi

      - name: Stop Gradle daemon after build
        if: always()
        working-directory: upstream
        run: |
          ./gradlew --stop || true

      - name: Locate built app
        id: app
        run: |
          set -euo pipefail

          echo "Looking for Nuvio.app..."

          APP_PATH="$(find \
            "$RUNNER_TEMP/nuvio-derived/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -type d \
            -name 'Nuvio.app' \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "Nuvio.app was not found."

            if [ -d "$RUNNER_TEMP/nuvio-derived/Build/Products" ]; then
              echo
              echo "Build products:"

              find \
                "$RUNNER_TEMP/nuvio-derived/Build/Products" \
                -maxdepth 3 \
                -print
            fi

            exit 1
          fi

          echo "Found app:"
          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Inspect app metadata
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app_path }}"
          PLIST="$APP/Info.plist"

          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo
          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST"

          echo
          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST"

          echo
          echo "Minimum iOS:"
          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$PLIST" || true

      - name: Show embedded frameworks and extensions
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app_path }}"

          echo "Frameworks:"

          if [ -d "$APP/Frameworks" ]; then
            find \
              "$APP/Frameworks" \
              -maxdepth 2 \
              -type d \
              -print
          else
            echo "No Frameworks directory found."
          fi

          echo
          echo "Extensions:"

          if [ -d "$APP/PlugIns" ]; then
            find \
              "$APP/PlugIns" \
              -maxdepth 2 \
              -type d \
              -print
          else
            echo "No PlugIns directory found."
          fi

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app_path }}"
          PACKAGE_DIR="$RUNNER_TEMP/nuvio-package"

          rm -rf "$PACKAGE_DIR"

          mkdir -p "$PACKAGE_DIR/Payload"

          cp -R \
            "$APP" \
            "$PACKAGE_DIR/Payload/Nuvio.app"

          IPA="$RUNNER_TEMP/Nuvio-${NUVIO_TAG}.ipa"

          cd "$PACKAGE_DIR"

          /usr/bin/zip \
            -qry \
            "$IPA" \
            Payload

          echo
          echo "Created IPA:"
          ls -lh "$IPA"

          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - name: Validate IPA
        run: |
          set -euo pipefail

          IPA="${{ steps.package.outputs.ipa }}"

          echo "Testing ZIP integrity..."
          unzip -t "$IPA"

          echo
          echo "IPA:"
          ls -lh "$IPA"

          echo
          echo "IPA contents:"
          unzip -l "$IPA" | head -100

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_URL: ${{ needs.check-release.outputs.upstream_url }}
          IS_PRERELEASE: ${{ needs.check-release.outputs.prerelease }}
        run: |
          set -euo pipefail

          IPA="${{ steps.package.outputs.ipa }}"

          NOTES="$(cat <<EOF
          Unofficial unsigned iOS build of Nuvio ${NUVIO_TAG}.

          Upstream source:
          ${UPSTREAM_URL}

          This IPA was built automatically from the official
          NuvioMedia/NuvioMobile ${NUVIO_TAG} source.

          No application source-code modifications are included.

          The CI environment creates the local.properties file required by
          the Gradle build and adjusts build memory limits for GitHub Actions.

          The IPA is unsigned and intended for sideloading with tools such
          as SideStore or Sideloadly.
          EOF
          )"

          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release create "$NUVIO_TAG" \
              "$IPA#Nuvio-${NUVIO_TAG}.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio ${NUVIO_TAG} iOS" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$NUVIO_TAG" \
              "$IPA#Nuvio-${NUVIO_TAG}.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio ${NUVIO_TAG} iOS" \
              --notes "$NOTES"
          fi
