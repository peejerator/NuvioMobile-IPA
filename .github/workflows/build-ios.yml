name: Build Nuvio iOS IPA

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream Nuvio tag. Leave blank for latest release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nuvio-ios-builder
  cancel-in-progress: false

jobs:
  check-release:
    name: Check upstream release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_build: ${{ steps.release.outputs.should_build }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      upstream_url: ${{ steps.release.outputs.upstream_url }}

    steps:
      - name: Determine Nuvio version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${MANUAL_TAG:-}" ]; then
            TAG="$MANUAL_TAG"

            RELEASE_JSON="$(gh api \
              "repos/NuvioMedia/NuvioMobile/releases/tags/$TAG")"
          else
            RELEASE_JSON="$(gh api \
              repos/NuvioMedia/NuvioMobile/releases/latest)"

            TAG="$(echo "$RELEASE_JSON" | jq -r '.tag_name')"
          fi

          PRERELEASE="$(echo "$RELEASE_JSON" | jq -r '.prerelease')"
          UPSTREAM_URL="$(echo "$RELEASE_JSON" | jq -r '.html_url')"

          echo "Upstream release: $TAG"
          echo "Prerelease: $PRERELEASE"
          echo "URL: $UPSTREAM_URL"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "upstream_url=$UPSTREAM_URL" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Release $TAG already exists in this repository."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG has not been built yet."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ needs.check-release.outputs.tag }}
    needs: check-release

    if: needs.check-release.outputs.should_build == 'true'

    runs-on: macos-26-intel

    env:
      NUVIO_TAG: ${{ needs.check-release.outputs.tag }}

    steps:
      - name: Show build environment
        run: |
          set -euo pipefail

          echo "macOS:"
          sw_vers

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-version

          echo
          echo "Physical memory:"
          sysctl hw.memsize || true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone official Nuvio release
        run: |
          set -euo pipefail

          git clone \
            --branch "$NUVIO_TAG" \
            --single-branch \
            --depth 1 \
            --recurse-submodules \
            https://github.com/NuvioMedia/NuvioMobile.git \
            upstream

          cd upstream

          git submodule update --init --recursive

          echo
          echo "Nuvio commit:"
          git rev-parse HEAD

          echo
          echo "MPVKit commit:"
          git -C MPVKit rev-parse HEAD

      - name: Show Nuvio version
        run: |
          set -euo pipefail

          if [ -f upstream/iosApp/Configuration/Version.xcconfig ]; then
            cat upstream/iosApp/Configuration/Version.xcconfig
          else
            echo "Version.xcconfig not found."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ runner.arch }}-${{ needs.check-release.outputs.tag }}-${{ hashFiles('upstream/**/*.gradle.kts', 'upstream/**/*.gradle', 'upstream/gradle/libs.versions.toml', 'upstream/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ runner.arch }}-${{ needs.check-release.outputs.tag }}-
            gradle-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Kotlin Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ needs.check-release.outputs.tag }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Create local.properties
        working-directory: upstream
        run: |
          set -euo pipefail

          touch local.properties

      - name: Configure Gradle for GitHub runner
        working-directory: upstream
        run: |
          set -euo pipefail

          sed -i '' \
            's/^org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx10240M -Xms1024M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m/' \
            gradle.properties

          sed -i '' \
            's/^kotlin\.daemon\.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx2048M/' \
            gradle.properties

          sed -i '' \
            's/^kotlin\.native\.jvmArgs=.*/kotlin.native.jvmArgs=-Xmx10240M/' \
            gradle.properties

          if grep -q '^org\.gradle\.workers\.max=' gradle.properties; then
            sed -i '' \
              's/^org\.gradle\.workers\.max=.*/org.gradle.workers.max=1/' \
              gradle.properties
          else
            echo 'org.gradle.workers.max=1' >> gradle.properties
          fi

          if grep -q '^org\.gradle\.parallel=' gradle.properties; then
            sed -i '' \
              's/^org\.gradle\.parallel=.*/org.gradle.parallel=false/' \
              gradle.properties
          else
            echo 'org.gradle.parallel=false' >> gradle.properties
          fi

          echo "Final memory settings:"

          grep -E \
            '^(org\.gradle\.jvmargs|kotlin\.daemon\.jvmargs|kotlin\.native\.jvmArgs|org\.gradle\.workers\.max|org\.gradle\.parallel)=' \
            gradle.properties || true

      - name: Make Gradle wrapper executable
        run: |
          set -euo pipefail

          chmod +x upstream/gradlew

      - name: Verify Gradle
        working-directory: upstream
        run: |
          set -euo pipefail

          ./gradlew --version

      - name: Stop existing Gradle daemons
        working-directory: upstream
        run: |
          set -euo pipefail

          ./gradlew --stop || true

      - name: Build unsigned iOS app
        working-directory: upstream
        run: |
          set -o pipefail

          BUILD_LOG="$RUNNER_TEMP/xcodebuild.log"

          echo "Building Nuvio $NUVIO_TAG..."
          echo

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

          echo

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/nuvio-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build \
            2>&1 | tee "$BUILD_LOG"

          BUILD_STATUS=${PIPESTATUS[0]}

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo
            echo "=================================================="
            echo "BUILD FAILED"
            echo "=================================================="
            echo

            grep -n -E \
              "FAILURE:|What went wrong|Execution failed|Exception|OutOfMemory|heap space|Compilation failed|error:|ERROR|e: " \
              "$BUILD_LOG" \
              | tail -300 || true

            echo
            echo "=================================================="
            echo "Last 400 lines"
            echo "=================================================="

            tail -400 "$BUILD_LOG" || true

            exit "$BUILD_STATUS"
          fi

      - name: Stop Gradle daemon
        if: always()
        working-directory: upstream
        run: |
          ./gradlew --stop || true

      - name: Locate built app
        id: app
        run: |
          set -euo pipefail

          APP_PATH="$(find \
            "$RUNNER_TEMP/nuvio-derived/Build/Products/Release-iphoneos" \
            -maxdepth 1 \
            -type d \
            -name 'Nuvio.app' \
            -print \
            -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "Nuvio.app was not found."
            exit 1
          fi

          echo "Found:"
          echo "$APP_PATH"

          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Inspect app metadata
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app_path }}"
          PLIST="$APP/Info.plist"

          echo "Bundle identifier:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$PLIST"

          echo "Version:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "$PLIST"

          echo "Build:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" \
            "$PLIST"

          echo "Minimum iOS:"
          /usr/libexec/PlistBuddy \
            -c "Print :MinimumOSVersion" \
            "$PLIST" || true

      - name: Package IPA
        id: package
        run: |
          set -euo pipefail

          APP="${{ steps.app.outputs.app_path }}"
          PACKAGE_DIR="$RUNNER_TEMP/nuvio-package"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"

          cp -R \
            "$APP" \
            "$PACKAGE_DIR/Payload/Nuvio.app"

          IPA="$RUNNER_TEMP/Nuvio-${NUVIO_TAG}.ipa"

          cd "$PACKAGE_DIR"

          /usr/bin/zip \
            -qry \
            "$IPA" \
            Payload

          echo "Created IPA:"
          ls -lh "$IPA"

          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - name: Validate IPA
        run: |
          set -euo pipefail

          IPA="${{ steps.package.outputs.ipa }}"

          unzip -t "$IPA"

          echo
          ls -lh "$IPA"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_URL: ${{ needs.check-release.outputs.upstream_url }}
          IS_PRERELEASE: ${{ needs.check-release.outputs.prerelease }}
        run: |
          set -euo pipefail

          IPA="${{ steps.package.outputs.ipa }}"

          NOTES="$(cat <<EOF
          Unofficial unsigned iOS build of Nuvio ${NUVIO_TAG}.

          Upstream source:
          ${UPSTREAM_URL}

          This IPA was built automatically from the official
          NuvioMedia/NuvioMobile ${NUVIO_TAG} source.

          No application source-code modifications are included.

          The IPA is unsigned and intended for sideloading with tools such
          as SideStore or Sideloadly.
          EOF
          )"

          if [ "$IS_PRERELEASE" = "true" ]; then
            gh release create "$NUVIO_TAG" \
              "$IPA#Nuvio-${NUVIO_TAG}.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio ${NUVIO_TAG} iOS" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$NUVIO_TAG" \
              "$IPA#Nuvio-${NUVIO_TAG}.ipa" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio ${NUVIO_TAG} iOS" \
              --notes "$NOTES"
          fi

  update-source:
    name: Update SideStore source

    needs:
      - check-release
      - build

    # Run when:
    # 1. check-release succeeded, AND
    # 2. the build either succeeded OR was skipped because the IPA
    #    already exists.
    #
    # This means your existing 0.4.0 release can be added to source.json
    # without rebuilding it.
    if: >-
      always() &&
      needs.check-release.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')

    runs-on: ubuntu-latest

    env:
      NUVIO_TAG: ${{ needs.check-release.outputs.tag }}

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download IPA from this repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p downloaded

          gh release download "$NUVIO_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.ipa" \
            --dir downloaded

          echo "Downloaded:"
          ls -lh downloaded

          IPA="$(find downloaded -maxdepth 1 -type f -name '*.ipa' -print -quit)"

          if [ -z "$IPA" ]; then
            echo "No IPA found in release $NUVIO_TAG"
            exit 1
          fi

          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Extract IPA metadata
        id: metadata
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import plistlib
          import zipfile

          ipa = os.environ["IPA_PATH"]

          with zipfile.ZipFile(ipa, "r") as z:
              plist_paths = [
                  name
                  for name in z.namelist()
                  if name.startswith("Payload/")
                  and name.count("/") == 2
                  and name.endswith(".app/Info.plist")
              ]

              if not plist_paths:
                  raise RuntimeError("Could not find app Info.plist in IPA")

              plist_path = plist_paths[0]
              info = plistlib.loads(z.read(plist_path))

          bundle_id = info["CFBundleIdentifier"]
          version = info["CFBundleShortVersionString"]
          build = info["CFBundleVersion"]
          min_os = info.get("MinimumOSVersion", "16.1")

          size = os.path.getsize(ipa)

          output = os.environ["GITHUB_OUTPUT"]

          with open(output, "a") as f:
              f.write(f"bundle_id={bundle_id}\n")
              f.write(f"version={version}\n")
              f.write(f"build={build}\n")
              f.write(f"min_os={min_os}\n")
              f.write(f"size={size}\n")

          print(f"Bundle ID: {bundle_id}")
          print(f"Version:   {version}")
          print(f"Build:     {build}")
          print(f"Min iOS:   {min_os}")
          print(f"IPA size:  {size}")
          PY

      - name: Get upstream release information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api \
            "repos/NuvioMedia/NuvioMobile/releases/tags/$NUVIO_TAG" \
            > "$RUNNER_TEMP/upstream-release.json"

          echo "Upstream release:"
          jq '{
            tag_name,
            published_at,
            html_url,
            prerelease
          }' "$RUNNER_TEMP/upstream-release.json"

      - name: Update source.json
        env:
          BUNDLE_ID: ${{ steps.metadata.outputs.bundle_id }}
          APP_VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_VERSION: ${{ steps.metadata.outputs.build }}
          MIN_OS: ${{ steps.metadata.outputs.min_os }}
          IPA_SIZE: ${{ steps.metadata.outputs.size }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["NUVIO_TAG"]

          bundle_id = os.environ["BUNDLE_ID"]
          version = os.environ["APP_VERSION"]
          build_version = os.environ["BUILD_VERSION"]
          min_os = os.environ["MIN_OS"]
          ipa_size = int(os.environ["IPA_SIZE"])

          release_info_path = Path(os.environ["RUNNER_TEMP"]) / "upstream-release.json"

          with release_info_path.open("r", encoding="utf-8") as f:
              upstream = json.load(f)

          date = upstream.get("published_at")
          release_notes = upstream.get("body") or f"Nuvio {version}"
          upstream_url = upstream.get("html_url")

          download_url = (
              f"https://github.com/{repo}/releases/download/"
              f"{tag}/Nuvio-{tag}.ipa"
          )

          icon_url = (
              "https://raw.githubusercontent.com/"
              f"NuvioMedia/NuvioMobile/{tag}/"
              "iosApp/iosApp/Assets.xcassets/"
              "AppIcon.appiconset/app-icon-1024.png"
          )

          website = f"https://github.com/{repo}"

          new_version = {
              "version": version,
              "buildVersion": build_version,
              "date": date,
              "localizedDescription": release_notes,
              "downloadURL": download_url,
              "size": ipa_size,
              "minOSVersion": min_os
          }

          source_path = Path("source.json")

          if source_path.exists():
              with source_path.open("r", encoding="utf-8") as f:
                  source = json.load(f)
          else:
              source = {
                  "name": "Nuvio iOS (Unofficial)",
                  "subtitle": "Automatic iOS builds of Nuvio",
                  "description": (
                      "Unofficial SideStore source containing iOS builds "
                      "created automatically from official Nuvio releases."
                  ),
                  "website": website,
                  "iconURL": icon_url,
                  "tintColor": "7B2FF7",
                  "news": [],
                  "apps": [
                      {
                          "name": "Nuvio",
                          "bundleIdentifier": bundle_id,
                          "developerName": "Nuvio",
                          "subtitle": "Watch your library, anywhere",
                          "localizedDescription": (
                              "Unofficial iOS build generated automatically "
                              "from the official NuvioMobile source code."
                          ),
                          "iconURL": icon_url,
                          "tintColor": "7B2FF7",
                          "category": "entertainment",
                          "versions": []
                      }
                  ]
              }

          # Keep source-level information current.
          source["website"] = website
          source["iconURL"] = icon_url

          app = source["apps"][0]

          app["bundleIdentifier"] = bundle_id
          app["iconURL"] = icon_url

          versions = app.setdefault("versions", [])

          # Remove any existing entry for the same version/build.
          versions = [
              item
              for item in versions
              if not (
                  item.get("version") == version
                  and str(item.get("buildVersion")) == str(build_version)
              )
          ]

          # Newest version belongs first.
          versions.insert(0, new_version)

          app["versions"] = versions

          with source_path.open("w", encoding="utf-8") as f:
              json.dump(
                  source,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")

          print()
          print("Updated source.json:")
          print()
          print(json.dumps(source, indent=2))
          PY

      - name: Validate source.json
        run: |
          set -euo pipefail

          python3 -m json.tool source.json >/dev/null

          echo "source.json is valid JSON."

          echo
          echo "Current versions:"

          jq -r \
            '.apps[0].versions[] |
            "\(.version) (\(.buildVersion)) -> \(.downloadURL)"' \
            source.json

      - name: Commit source.json
        run: |
          set -euo pipefail

          if git diff --quiet -- source.json && git ls-files --error-unmatch source.json >/dev/null 2>&1; then
            echo "source.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source.json

          git commit \
            -m "Update SideStore source for Nuvio $NUVIO_TAG"

          git push origin main

      - name: Show SideStore source URL
        run: |
          set -euo pipefail

          echo
          echo "=================================================="
          echo "SideStore source URL"
          echo "=================================================="
          echo
          echo "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/source.json"
          echo
